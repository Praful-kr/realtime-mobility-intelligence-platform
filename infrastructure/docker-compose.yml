name: mobility

x-kafka-broker: &kafka-broker
  image: apache/kafka:3.8.0
  restart: unless-stopped
  healthcheck:
    test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
    interval: 10s
    timeout: 10s
    retries: 12
    start_period: 20s

x-kafka-env: &kafka-env
  CLUSTER_ID: ${KAFKA_CLUSTER_ID}
  KAFKA_PROCESS_ROLES: broker,controller
  KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
  KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
  KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
  KAFKA_DEFAULT_REPLICATION_FACTOR: ${KAFKA_REPLICATION_FACTOR}
  KAFKA_MIN_INSYNC_REPLICAS: ${KAFKA_MIN_ISR}
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
  KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
  KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
  KAFKA_HEAP_OPTS: ${KAFKA_HEAP}
  KAFKA_LOG_RETENTION_HOURS: 24

x-spark-env: &spark-env
  MINIO_ROOT_USER: ${MINIO_ROOT_USER}
  MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
  KAFKA_BOOTSTRAP: kafka-1:9092,kafka-2:9092,kafka-3:9092
  S3_ENDPOINT: http://minio:9000
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  POSTGRES_USER: ${POSTGRES_USER}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  POSTGRES_DB: ${POSTGRES_DB}

x-spark-stream: &spark-stream
  image: mobility-spark:3.5.3
  profiles: ["streaming"]
  restart: on-failure
  stop_grace_period: 60s   # SIGTERM -> let the in-flight micro-batch finish (compose default is 10 s, then SIGKILL)
  depends_on:
    minio: {condition: service_healthy}
    kafka-1: {condition: service_healthy}
    postgres: {condition: service_healthy}
  entrypoint: ["bash", "/opt/app/infrastructure/spark/submit.sh"]
  volumes:
    - ../:/opt/app:ro

services:
  kafka-1:
    <<: *kafka-broker
    hostname: kafka-1
    ports: ["19092:19092"]
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 1
      KAFKA_LISTENERS: CONTROLLER://:9093,INTERNAL://:9092,EXTERNAL://:19092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-1:9092,EXTERNAL://localhost:19092
    volumes: [kafka-1-data:/var/lib/kafka/data]

  kafka-2:
    <<: *kafka-broker
    hostname: kafka-2
    ports: ["19093:19093"]
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 2
      KAFKA_LISTENERS: CONTROLLER://:9093,INTERNAL://:9092,EXTERNAL://:19093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-2:9092,EXTERNAL://localhost:19093
    volumes: [kafka-2-data:/var/lib/kafka/data]

  kafka-3:
    <<: *kafka-broker
    hostname: kafka-3
    ports: ["19094:19094"]
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 3
      KAFKA_LISTENERS: CONTROLLER://:9093,INTERNAL://:9092,EXTERNAL://:19094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-3:9092,EXTERNAL://localhost:19094
    volumes: [kafka-3-data:/var/lib/kafka/data]

  schema-registry:
    image: confluentinc/cp-schema-registry:7.6.1
    restart: unless-stopped
    depends_on:
      kafka-1: {condition: service_healthy}
      kafka-2: {condition: service_healthy}
      kafka-3: {condition: service_healthy}
    ports: ["8081:8081"]
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka-1:9092,kafka-2:9092,kafka-3:9092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_KAFKASTORE_TOPIC_REPLICATION_FACTOR: 3
      SCHEMA_REGISTRY_SCHEMA_COMPATIBILITY_LEVEL: BACKWARD
      SCHEMA_REGISTRY_HEAP_OPTS: -Xms128m -Xmx384m
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8081/subjects >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    restart: unless-stopped
    depends_on:
      schema-registry: {condition: service_healthy}
    ports: ["8080:8080"]
    environment:
      KAFKA_CLUSTERS_0_NAME: mobility
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka-1:9092,kafka-2:9092,kafka-3:9092
      KAFKA_CLUSTERS_0_SCHEMAREGISTRY: http://schema-registry:8081
      JAVA_OPTS: -Xms128m -Xmx384m
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  # NOTE: upstream minio/minio images were removed from Docker Hub/quay. This is the last
  # Bitnami-legacy build of real MinIO (2025.7.23): frozen, no security patches. Local dev only.
  minio:
    image: bitnamilegacy/minio:2025.7.23
    restart: unless-stopped
    ports: ["9000:9000"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_DEFAULT_BUCKETS: lakehouse,checkpoints
    volumes: [minio-data:/bitnami/minio/data]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports: ["5433:5432"]   # 5433 on the host to avoid clashing with a local Postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build:
      context: ..
      dockerfile: api/Dockerfile
    image: mobility-api:1.0
    restart: unless-stopped
    depends_on:
      postgres: {condition: service_healthy}
    ports: ["8000:8000"]
    environment:
      API_DB_HOST: postgres
      API_DB_PORT: "5432"
      API_DB_NAME: ${POSTGRES_DB}
      API_DB_USER: api_ro
      API_DB_PASSWORD: ${API_DB_PASSWORD:-api_ro_dev}
    mem_limit: 256m
    healthcheck:   # readiness, not just liveness: unhealthy if the DB or schema is unavailable
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health/ready', timeout=3).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ---- long-running streaming jobs (profile "streaming"): docker compose --profile streaming up -d ----
  spark-bronze:
    <<: *spark-stream
    command: ["bronze_stream", "--trigger", "5"]
    mem_limit: 1536m
    environment: {<<: *spark-env, METRICS_PORT: "8001", SPARK_DRIVER_MEMORY: 768m}

  spark-silver:
    <<: *spark-stream
    command: ["silver_stream", "--trigger", "5"]
    mem_limit: 1792m
    environment: {<<: *spark-env, METRICS_PORT: "8002", SPARK_DRIVER_MEMORY: 1g}

  spark-gold:
    <<: *spark-stream
    command: ["gold_stream", "--trigger", "5", "--watermark", "30 minutes"]
    mem_limit: 2g
    environment: {<<: *spark-env, METRICS_PORT: "8003", SPARK_DRIVER_MEMORY: 1g}

  # ---- observability ----
  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.8.0
    restart: unless-stopped
    command: ["--kafka.server=kafka-1:9092", "--kafka.server=kafka-2:9092", "--kafka.server=kafka-3:9092",
              "--topic.filter=trips\\..*", "--group.filter=.*"]
    depends_on:
      kafka-1: {condition: service_healthy}
    mem_limit: 128m

  prometheus:
    image: prom/prometheus:v2.55.1
    restart: unless-stopped
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=7d",
              "--web.enable-lifecycle"]
    ports: ["9090:9090"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes:
      - ../monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../monitoring/prometheus/rules.yml:/etc/prometheus/rules.yml:ro
      - prometheus-data:/prometheus
    mem_limit: 384m
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/ready"]
      interval: 10s
      timeout: 5s
      retries: 6

  grafana:
    image: grafana/grafana:11.3.1
    restart: unless-stopped
    depends_on:
      prometheus: {condition: service_healthy}
      postgres: {condition: service_healthy}
    ports: ["3000:3000"]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/pipeline.json
      API_DB_PASSWORD: ${API_DB_PASSWORD:-api_ro_dev}
    volumes:
      - ../monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../dashboards/grafana:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    mem_limit: 384m
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health | grep -q ok"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  # Generic Spark job runner:  docker compose --profile jobs run --rm spark-job <job> [args]
  spark-job:
    image: mobility-spark:3.5.3
    profiles: ["jobs"]
    depends_on:
      minio: {condition: service_healthy}
      kafka-1: {condition: service_healthy}
      postgres: {condition: service_healthy}
    entrypoint: ["bash", "/opt/app/infrastructure/spark/submit.sh"]
    mem_limit: 2g
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      KAFKA_BOOTSTRAP: kafka-1:9092,kafka-2:9092,kafka-3:9092
      S3_ENDPOINT: http://minio:9000
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ../:/opt/app:ro

volumes:
  prometheus-data:
  grafana-data:
  postgres-data:
  kafka-1-data:
  kafka-2-data:
  kafka-3-data:
  minio-data:
