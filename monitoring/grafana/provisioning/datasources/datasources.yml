apiVersion: 1
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData: {timeInterval: 5s}
  - name: Gold (Postgres)
    uid: postgres
    type: grafana-postgresql-datasource
    access: proxy
    url: postgres:5432
    user: api_ro                      # read-only role
    jsonData: {database: mobility, sslmode: disable, postgresVersion: 1600, timescaledb: false}
    secureJsonData: {password: "${API_DB_PASSWORD}"}
