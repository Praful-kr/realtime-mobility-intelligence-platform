global:
  scrape_interval: 5s        # demo-friendly; use 15-30s in production
  evaluation_interval: 5s
rule_files:
  - /etc/prometheus/rules.yml
scrape_configs:
  - job_name: prometheus
    static_configs: [{targets: ["localhost:9090"]}]
  - job_name: api
    static_configs: [{targets: ["api:8000"]}]
  - job_name: kafka
    static_configs: [{targets: ["kafka-exporter:9308"]}]
  - job_name: spark-bronze
    static_configs: [{targets: ["spark-bronze:8001"]}]
  - job_name: spark-silver
    static_configs: [{targets: ["spark-silver:8002"]}]
  - job_name: spark-gold
    static_configs: [{targets: ["spark-gold:8003"]}]
  - job_name: producer          # runs on the host while a replay is active
    static_configs: [{targets: ["host.docker.internal:8010"]}]
